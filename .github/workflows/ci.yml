name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build, every test (C++, Python, Rust), the FetchContent consumer example,
  # and `pip install .` -- all in scripts/ci.sh, which runs the same locally.
  linux:
    name: linux / ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: clang-19, cxx: clang++-19, package: clang-19 }
          - { cc: clang-20, cxx: clang++-20, package: clang-20 }
          - { cc: gcc-13, cxx: g++-13, package: g++-13 }
          - { cc: gcc-14, cxx: g++-14, package: g++-14 }
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.package }} ninja-build python3-dev python3-venv
      - name: scripts/ci.sh
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: scripts/ci.sh

  # The API exercise under AddressSanitizer + UndefinedBehaviorSanitizer and
  # ThreadSanitizer (dependencies instrumented too).
  sanitizers:
    name: sanitizer / ${{ matrix.sanitize }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-20 ninja-build
      - name: Configure and build
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSCANN_SANITIZE=${{ matrix.sanitize }} \
            -DSCANN_BUILD_PYTHON=OFF -DSCANN_BUILD_RUST_BINDINGS=OFF \
            -DSCANN_BUILD_SHARED=OFF -DSCANN_BUILD_EXAMPLES=OFF
          cmake --build build --target scann_core_api_exercise
      - name: Run
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: build/tests/scann_core_api_exercise - 0

  # Rust lints and the minimum supported Rust version. DOCS_RS=1 makes
  # build.rs skip the C++ build, which neither check needs.
  rust:
    runs-on: ubuntu-24.04
    env:
      DOCS_RS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: clippy
        run: |
          rustup component add clippy
          cargo clippy --all-targets --locked -- -D warnings
      - name: MSRV
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --all-targets --locked
