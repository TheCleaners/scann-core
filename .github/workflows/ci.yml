name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Compiler output is cached with ccache (per job and compiler), so a push
# that touches a few files rebuilds only those.
env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  # Paths under the checkout are hashed relative to it.
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  # Build, every test (C++, Python, Rust), the FetchContent consumer example,
  # and `pip install .` -- all in scripts/ci.sh, which runs the same locally.
  # The oldest supported compilers (clang 19, GCC 13) and the newest Ubuntu
  # 26.04 packages, plus aarch64 natively.
  linux:
    name: ${{ matrix.arch }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-26.04, cc: clang-19, cxx: clang++-19, package: clang-19 }
          - { arch: x86-64, runner: ubuntu-26.04, cc: clang-22, cxx: clang++-22, package: clang-22 }
          - { arch: x86-64, runner: ubuntu-26.04, cc: gcc-13, cxx: g++-13, package: g++-13 }
          - { arch: x86-64, runner: ubuntu-26.04, cc: gcc-15, cxx: g++-15, package: g++-15 }
          - { arch: aarch64, runner: ubuntu-26.04-arm, cc: clang-22, cxx: clang++-22, package: clang-22 }
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.package }} cmake ninja-build python3-dev python3-venv
      - uses: dtolnay/rust-toolchain@stable
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.runner }}-${{ matrix.cc }}
          max-size: 2G
      - name: scripts/ci.sh
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: scripts/ci.sh

  # The Python package and tests on every supported CPython, including the
  # free-threaded builds (the C++ library is compiled once). Python 3.12 also
  # gets tensorflow-cpu, langchain-community and PyTorch (CPU), for the tests
  # that need them (see the script). libomp-22-dev: torch.compile on the CPU
  # compiles C++ with -fopenmp using $CXX.
  python:
    name: python / 3.10-3.15t
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-22 libomp-22-dev cmake ninja-build
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: python-versions
          max-size: 2G
      - name: scripts/python-versions.sh
        env:
          CC: clang-22
          CXX: clang++-22
        run: scripts/python-versions.sh

  # The optional TensorFlow op (-DSCANN_BUILD_TF_OP=ON, tf_op/), built
  # against tensorflow-cpu 2.21 in a venv: its symbol check, python_tf_ops,
  # scann.tf with both backends and the TensorFlow examples (none of which
  # may skip; SCANN_TF_BACKEND=op makes a broken op an error instead of a
  # fallback to the Python backend). Downloads TensorFlow, so not on every
  # pull request.
  tf-op:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-22 cmake ninja-build
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tf-op
          max-size: 2G
      - name: Build and test the op
        env:
          CC: clang-22
          CXX: clang++-22
          SCANN_TEST_REQUIRE_TF: "1"
          SCANN_TEST_REQUIRE_TF_OP: "1"
          SCANN_TF_BACKEND: op
        run: |
          uv venv -q --python 3.12 "$RUNNER_TEMP/tf"
          VIRTUAL_ENV="$RUNNER_TEMP/tf" uv pip install -q numpy "protobuf>=7.36.2" "tensorflow-cpu~=2.21.0"
          cmake -S . -B build -G Ninja -DPython_EXECUTABLE="$RUNNER_TEMP/tf/bin/python" \
            -DSCANN_BUILD_TF_OP=ON -DSCANN_BUILD_RUST_BINDINGS=OFF \
            -DSCANN_BUILD_SHARED=OFF -DSCANN_BUILD_EXAMPLES=OFF
          cmake --build build
          ctest --test-dir build -R '^(tf_op_|python_tf|example_py_tensorflow)' \
            --output-on-failure --no-tests=error

  # The native PyTorch op (-DSCANN_BUILD_TORCH_OP=ON, torch_op/), built
  # against the headers of torch 2.10.0 (CPU; the build-time pin of the
  # scann-core-torch wheel) and tested with the newest CPU torch: its symbol
  # check, python_torch on both backends, python_torch_native (which must
  # not skip) and the example. Downloads PyTorch twice, so not on every pull
  # request. libomp-22-dev: Inductor compiles C++ with -fopenmp using $CXX.
  # Every path the compiler sees is the same on each run (the checkout,
  # build/, and the venvs at fixed places in $RUNNER_TEMP, whose torch
  # headers are pinned), so a run after the first compiles only what
  # changed; keep it that way (no mktemp or version-named directories).
  torch-op:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-22 libomp-22-dev cmake ninja-build
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: torch-op
          max-size: 2G
      - name: Build and test the op
        env:
          CC: clang-22
          CXX: clang++-22
          SCANN_TEST_REQUIRE_TORCH: "1"
        run: |
          uv venv -q --python 3.12 "$RUNNER_TEMP/torch-headers"
          VIRTUAL_ENV="$RUNNER_TEMP/torch-headers" uv pip install -q "torch==2.10.0" \
            --index-url https://download.pytorch.org/whl/cpu
          uv venv -q --python 3.12 "$RUNNER_TEMP/torch"
          VIRTUAL_ENV="$RUNNER_TEMP/torch" uv pip install -q torch \
            --index-url https://download.pytorch.org/whl/cpu
          VIRTUAL_ENV="$RUNNER_TEMP/torch" uv pip install -q numpy "protobuf>=7.36.2"
          cmake -S . -B build -G Ninja -DPython_EXECUTABLE="$RUNNER_TEMP/torch/bin/python" \
            -DSCANN_BUILD_TORCH_OP=ON -DSCANN_TORCH_PYTHON="$RUNNER_TEMP/torch-headers/bin/python" \
            -DSCANN_BUILD_RUST_BINDINGS=OFF -DSCANN_BUILD_SHARED=OFF -DSCANN_BUILD_EXAMPLES=OFF
          cmake --build build
          ctest --test-dir build -R '^(torch_op_|python_torch|example_py_torch)' \
            --output-on-failure --no-tests=error

  # aarch64 cross build, with the tests run under QEMU on emulated CPUs that
  # select different kernels (Neon only, dot product, SVE at 128-2048 bits,
  # SVE2). The native aarch64 job above only sees the runner's own CPU.
  # Slow (emulation), so not on every pull request.
  # The build runs in a container, so ccache's directory is mounted into it
  # and its settings are passed explicitly (docker run doesn't inherit env).
  cross-aarch64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.ccache-cross
          key: ccache-cross-aarch64-${{ github.sha }}
          restore-keys: ccache-cross-aarch64-
      - name: scripts/cross-aarch64.sh (in ubuntu:26.04)
        run: |
          mkdir -p ~/.ccache-cross
          docker run --rm -v "$PWD:/src" -w /src -v ~/.ccache-cross:/ccache \
            -e CCACHE_DIR=/ccache -e CCACHE_BASEDIR=/src -e CCACHE_MAXSIZE=2G \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ubuntu:26.04 scripts/cross-aarch64.sh
      - name: Let the cache step read the container's files
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.ccache-cross

  # The API exercise under AddressSanitizer + UndefinedBehaviorSanitizer and
  # ThreadSanitizer (dependencies instrumented too).
  sanitizers:
    name: sanitizer / ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # `name` doubles as the ccache key, which can't contain commas.
          - { name: asan-ubsan, sanitize: "address,undefined" }
          - { name: tsan, sanitize: thread }
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-22 cmake ninja-build
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitize-${{ matrix.name }}
          max-size: 2G
      - name: Configure and build
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSCANN_SANITIZE=${{ matrix.sanitize }} \
            -DSCANN_BUILD_PYTHON=OFF -DSCANN_BUILD_RUST_BINDINGS=OFF \
            -DSCANN_BUILD_SHARED=OFF -DSCANN_BUILD_EXAMPLES=OFF
          cmake --build build --target scann_core_api_exercise scann_core_config_regressions \
            scann_core_artifact_loading scann_core_mutation_regressions scann_core_mutfuzz
      - name: Run
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          build/tests/scann_core_api_exercise - 0
          # Again with the AVX2 kernels, which AVX-512 runners otherwise skip.
          SCANN_TEST_FORCE_AVX2=1 build/tests/scann_core_api_exercise - 0
          build/tests/scann_core_config_regressions
          build/tests/scann_core_artifact_loading
          SCANN_TEST_FORCE_AVX2=1 build/tests/scann_core_artifact_loading
          build/tests/scann_core_mutation_regressions
          ctest --test-dir build -L mutfuzz -j "$(nproc)" --output-on-failure

  # Rust lints and the minimum supported Rust version. DOCS_RS=1 makes
  # build.rs skip the C++ build, which neither check needs.
  rust:
    runs-on: ubuntu-26.04
    env:
      DOCS_RS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: MSRV
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --all-targets --locked

  # One wheel per architecture on pushes to main, through the release's own
  # wheel workflow: checks the wheel build between releases, and saves the
  # ccache (on main) that release tags restore.
  wheel-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/wheels.yml
    with:
      build: "cp312-*"
      upload: false

  # The same for the scann-core-torch wheels (torch-wheels.yml).
  torch-wheel-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/torch-wheels.yml
    with:
      upload: false

  # The crate as published: `cargo package` builds the packaged sources on
  # their own, C++ library included, as a crates.io user would. Catches files
  # missing from Cargo.toml's include list before a release, and fills the
  # ccache that the release's `cargo publish` restores (key `crate`).
  crate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-22 cmake ninja-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: crate
          max-size: 2G
          verbose: 1
      - name: cargo package
        env:
          CC: clang-22
          CXX: clang++-22
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: cargo package --locked
