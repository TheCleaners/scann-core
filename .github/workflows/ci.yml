name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Compiler output is cached with ccache (per job and compiler), so a push
# that touches a few files rebuilds only those.
env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  # Build, every test (C++, Python, Rust), the FetchContent consumer example,
  # and `pip install .` -- all in scripts/ci.sh, which runs the same locally.
  # The oldest supported compilers (clang 19, GCC 13) and the newest Ubuntu
  # 26.04 packages, plus aarch64 natively.
  linux:
    name: ${{ matrix.arch }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-26.04, cc: clang-19, cxx: clang++-19, package: clang-19 }
          - { arch: x86-64, runner: ubuntu-26.04, cc: clang-22, cxx: clang++-22, package: clang-22 }
          - { arch: x86-64, runner: ubuntu-26.04, cc: gcc-13, cxx: g++-13, package: g++-13 }
          - { arch: x86-64, runner: ubuntu-26.04, cc: gcc-15, cxx: g++-15, package: g++-15 }
          - { arch: aarch64, runner: ubuntu-26.04-arm, cc: clang-22, cxx: clang++-22, package: clang-22 }
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.package }} cmake ninja-build python3-dev python3-venv
      - uses: dtolnay/rust-toolchain@stable
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.runner }}-${{ matrix.cc }}
          max-size: 2G
      - name: scripts/ci.sh
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: scripts/ci.sh

  # The Python package and tests on every supported CPython, including the
  # free-threaded builds (the C++ library is compiled once).
  python:
    name: python / 3.10-3.15t
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-22 cmake ninja-build
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: python-versions
          max-size: 2G
      - name: scripts/python-versions.sh
        env:
          CC: clang-22
          CXX: clang++-22
        run: scripts/python-versions.sh

  # aarch64 cross build, with the tests run under QEMU on emulated CPUs that
  # select different kernels (Neon only, dot product, SVE at 128-2048 bits,
  # SVE2). The native aarch64 job above only sees the runner's own CPU.
  # Slow (emulation), so not on every pull request.
  cross-aarch64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: scripts/cross-aarch64.sh (in ubuntu:26.04)
        run: docker run --rm -v "$PWD:/src" -w /src ubuntu:26.04 scripts/cross-aarch64.sh

  # The API exercise under AddressSanitizer + UndefinedBehaviorSanitizer and
  # ThreadSanitizer (dependencies instrumented too).
  sanitizers:
    name: sanitizer / ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # `name` doubles as the ccache key, which can't contain commas.
          - { name: asan-ubsan, sanitize: "address,undefined" }
          - { name: tsan, sanitize: thread }
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-22 cmake ninja-build
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitize-${{ matrix.name }}
          max-size: 2G
      - name: Configure and build
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSCANN_SANITIZE=${{ matrix.sanitize }} \
            -DSCANN_BUILD_PYTHON=OFF -DSCANN_BUILD_RUST_BINDINGS=OFF \
            -DSCANN_BUILD_SHARED=OFF -DSCANN_BUILD_EXAMPLES=OFF
          cmake --build build --target scann_core_api_exercise
      - name: Run
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: build/tests/scann_core_api_exercise - 0

  # Rust lints and the minimum supported Rust version. DOCS_RS=1 makes
  # build.rs skip the C++ build, which neither check needs.
  rust:
    runs-on: ubuntu-26.04
    env:
      DOCS_RS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: MSRV
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --all-targets --locked
