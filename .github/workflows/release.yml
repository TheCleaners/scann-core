# On a v* tag: build Linux wheels (manylinux, x86-64 and aarch64; CPython
# 3.10-3.15 and free-threaded 3.14t and 3.15t) and the sdist, create a
# GitHub release with them, and publish to PyPI and crates.io.
#
# Publishing needs API tokens as repository (or environment) secrets:
#   * PyPI: PYPI_API_TOKEN;
#   * crates.io: CARGO_REGISTRY_TOKEN.
# The publish jobs run in the environments `pypi` and `crates-io`; add
# required reviewers there (repository settings) to approve each publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml

  sdist:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  github-release:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}

  pypi:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Builds the packaged crate on its own (C++ library included), as
  # crates.io users will, in parallel with the wheels; `cargo publish` then
  # only uploads. ccache restores the cache CI's `crate` job fills on main.
  crate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-22 cmake ninja-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: crate
          max-size: 2G
          verbose: 1
      - env:
          CC: clang-22
          CXX: clang++-22
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: cargo package --locked

  crates-io:
    needs: [wheels, sdist, crate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The `crate` job built and verified this commit's package.
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify
