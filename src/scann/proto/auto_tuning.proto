syntax = "proto2";

package research_scann;

message AutopilotTreeAH {
  optional int64 l1_size = 1 [default = 32768];

  optional int64 l3_size = 2 [default = 33554432];

  enum IncrementalMode {
    NONE = 0;

    ONLINE = 1;

    ONLINE_INCREMENTAL = 2;
  }
  optional IncrementalMode incremental_mode = 3 [default = NONE];

  enum DataType {
    UNKNOWN = 0;
    FLOAT32 = 1;
    BFLOAT16 = 2;
    INT8 = 3;
  }
  optional DataType reordering_dtype = 4 [default = BFLOAT16];

  optional int64 partitioning_expected_sample_size = 5;

  optional int64 num_leaf_partitions = 6;

  optional float fraction_leaf_partitions = 8;

  optional int64 first_n_leaf_partitions_for_assignment = 7;

  // scann-core: the rules that choose the configuration (see
  // scann/utils/single_machine_autopilot.cc and docs/tuning.md). Unset means
  // UPSTREAM, upstream ScaNN's rules: indexes saved without this field (by
  // upstream ScaNN and scann-core <= 0.2.0) reload, retrain and maintain
  // themselves with the rules they were built with. scann-core's builders
  // set TUNED_V1 unless asked for upstream's. A later revision of the rules
  // gets a new value, so a saved index keeps its own.
  enum Rules {
    UPSTREAM = 0;
    TUNED_V1 = 1;
  }
  optional Rules rules = 900;

  // scann-core, TUNED_V1 on dot-product indexes (DotProductDistance, or
  // squared L2 through l2_as_dot_product): the AH anisotropic quantization
  // threshold (hash.asymmetric_hash.noise_shaping_threshold); NaN for none.
  // Unset: derived from the dimensionality and the datapoints' norms when
  // the index is built, and recorded here, so that reloading, retraining and
  // incremental maintenance keep it.
  optional double noise_shaping_threshold = 901;

  // scann-core, TUNED_V1: whether a SquaredL2Distance index may be built as
  // l2_as_dot_product (squared L2 through an inner-product index), which the
  // rules choose when the data suits it. false keeps it a plain squared L2
  // index.
  optional bool allow_l2_as_dot_product = 902 [default = true];

  // scann-core: an opt-in recall target, in (0, 1]. When an index is built
  // from data (ScannInterface::Initialize), its default leaves_to_search and
  // pre-reordering count are calibrated to reach this recall@num_neighbors,
  // measured against brute force on sample queries, and recorded in
  // `calibration`. The index structure is the rules' as without it. Unset:
  // the rules' defaults.
  optional double target_recall = 903;

  // scann-core: with target_recall and no sample queries given, how many
  // datapoints the calibration uses as queries (0: the default, 1000).
  optional int32 calibration_sample_size = 904;

  // scann-core: the calibrated search defaults (see target_recall), filled
  // in when the index is built. Autopilot() applies them, so a reloaded or
  // retrained index keeps them.
  optional AutopilotCalibration calibration = 905;
}

// scann-core: the outcome of calibrating an index's search defaults to
// AutopilotTreeAH.target_recall.
message AutopilotCalibration {
  // What was asked: the target and the number of neighbors it applies to.
  optional double target_recall = 1;
  optional int32 num_neighbors = 2;

  // The chosen defaults: partitioning.query_spilling.max_spill_centers and
  // exact_reordering.approx_num_neighbors. Unset where the index has no
  // tree or no reordering.
  optional int32 leaves_to_search = 3;
  optional int32 pre_reordering_num_neighbors = 4;

  // The recall the sample queries got at the chosen defaults, and whether
  // it reached the target (if no setting did, the one with the highest
  // recall was chosen).
  optional double sample_recall = 5;
  optional bool target_met = 6;

  // The sample queries: how many, and whether they were datapoints (each
  // query's own datapoint is left out of its neighbors) or given.
  enum QuerySource {
    DATAPOINTS = 0;
    GIVEN = 1;
  }
  optional QuerySource query_source = 7;
  optional int32 num_queries = 8;
}

message AutopilotConfig {
  oneof autopilot_option {
    AutopilotTreeAH tree_ah = 1;
  }
}
